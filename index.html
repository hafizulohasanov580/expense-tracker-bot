<style>
  :root{
    --bg:#0b0d12; --bg2:#12151d; --card:#171a23; --card2:#1e2230; --text:#f0f2f7; --muted:#94a0b4;
    --accent:#7c8cff; --accent2:#9d6bff; --danger:#ff6b7d; --ok:#33d192; --warn:#ffb340; --border:#262b38;
    --shadow:0 10px 30px rgba(0,0,0,.35); --radius:18px; --radius-sm:12px;
    --grad: linear-gradient(135deg, var(--accent), var(--accent2));
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f2f4f9; --bg2:#eceff6; --card:#ffffff; --card2:#f3f5fa; --text:#1a1d29; --muted:#69728a;
      --accent:#5b6cf0; --accent2:#8b5cf6; --danger:#e5484d; --ok:#18a76c; --warn:#c9770c; --border:#e5e8f0;
      --shadow:0 10px 30px rgba(30,40,80,.10);
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding-bottom:100px;-webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
  }

  header{
    position:sticky;top:0;background:linear-gradient(180deg,var(--bg) 60%,transparent);
    backdrop-filter:blur(10px);padding:18px 16px 10px;z-index:5;
  }
  .header-row{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1080px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .logo{
    width:38px;height:38px;border-radius:12px;background:var(--grad);
    display:flex;align-items:center;justify-content:center;font-size:19px;
    box-shadow:0 6px 16px rgba(124,140,255,.35);
  }
  h1{font-size:19px;margin:0 0 1px;font-weight:700;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:12.5px}
  .gear{
    width:38px;height:38px;border-radius:12px;border:1px solid var(--border);background:var(--card2);
    color:var(--text);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:transform .15s ease, background .15s ease;
  }
  .gear:active{transform:scale(.92)}

  main{padding:6px 16px 8px;max-width:1080px;margin:0 auto;animation:fadeIn .22s ease both}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .layout{display:block}
  @media (min-width:860px){
    .layout{display:grid;grid-template-columns:380px 1fr;gap:22px;align-items:start}
    .fab{right:calc((100vw - 1080px)/2 + 16px)}
  }

  .tabs{display:flex;gap:6px;margin:10px 0 14px;background:var(--card2);padding:4px;border-radius:14px;border:1px solid var(--border)}
  .tab{flex:1;text-align:center;padding:9px 6px;border-radius:10px;color:var(--muted);font-size:13.5px;font-weight:600;cursor:pointer;transition:all .2s ease;user-select:none}
  .tab.active{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(124,140,255,.35)}
  .tab:not(.active):hover{color:var(--text)}

  .card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;
    margin-bottom:14px;box-shadow:var(--shadow);
    animation:riseIn .28s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes riseIn{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}

  .total-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .total{font-size:34px;font-weight:800;letter-spacing:-.02em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .total .cur{font-size:17px;color:var(--muted);font-weight:600;-webkit-text-fill-color:var(--muted)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px}

  .catbar-wrap{margin-top:16px}
  .catrow{margin-bottom:12px}
  .catrow:last-child{margin-bottom:0}
  .catrow .row{font-size:13.5px;margin-bottom:5px}
  .catrow .cat-name{display:flex;align-items:center;gap:7px;font-weight:600}
  .catrow .cat-icon{font-size:15px}
  .bar-bg{height:8px;background:var(--card2);border-radius:6px;overflow:hidden}
  .bar-fill{height:100%;background:var(--grad);border-radius:6px;width:0;transition:width .45s cubic-bezier(.2,.8,.2,1)}
  .bar-fill.over{background:linear-gradient(135deg,var(--danger),#ff9166)}

  .day-group{margin-bottom:4px}
  .day-label{color:var(--muted);font-size:11.5px;margin:16px 2px 8px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
  .expense{
    display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius-sm);padding:13px 14px;margin-bottom:9px;
    animation:itemIn .2s cubic-bezier(.2,.8,.2,1) both;
    transition:transform .15s ease, box-shadow .15s ease, opacity .16s ease, max-height .18s ease, margin .18s ease, padding .18s ease;
  }
  .expense.leaving{opacity:0;transform:scale(.94);max-height:0;margin-bottom:0;padding-top:0;padding-bottom:0;overflow:hidden}
  @keyframes itemIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (hover:hover){ .expense:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.12)} }
  .expense .left{display:flex;align-items:center;gap:11px;min-width:0}
  .expense .cat-emoji{
    width:36px;height:36px;border-radius:10px;background:var(--card2);flex:none;
    display:flex;align-items:center;justify-content:center;font-size:16px;
  }
  .expense .meta{min-width:0}
  .expense .desc{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .expense .cat{color:var(--muted);font-size:12px;margin-top:1px}
  .expense .amt{font-weight:700;font-size:15px;white-space:nowrap;margin-left:10px}
  .expense .actions{display:flex;gap:6px;margin-left:8px}
  .iconbtn{border:none;background:var(--card2);color:var(--muted);width:30px;height:30px;border-radius:9px;font-size:13.5px;cursor:pointer;transition:transform .15s ease, background .15s ease, color .15s ease}
  .iconbtn:hover{color:var(--text);background:var(--border)}
  .iconbtn:active{transform:scale(.9)}

  .fab{
    position:fixed;right:18px;bottom:22px;width:58px;height:58px;border-radius:50%;background:var(--grad);color:#fff;
    font-size:26px;border:none;box-shadow:0 10px 24px rgba(124,140,255,.45);cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:transform .18s cubic-bezier(.34,1.56,.64,1);
  }
  .fab:hover{transform:scale(1.06)}
  .fab:active{transform:scale(.92)}

  .empty{color:var(--muted);text-align:center;padding:36px 14px;font-size:13.5px;line-height:1.5}
  .empty .emoji{font-size:30px;display:block;margin-bottom:8px}

  .toolbar{display:flex;gap:8px;margin-bottom:12px}
  .btn{
    flex:1;padding:11px;border-radius:12px;border:1px solid var(--border);background:var(--card2);color:var(--text);
    font-size:13.5px;font-weight:600;cursor:pointer;transition:transform .15s ease, background .15s ease;
    font-family:inherit;
  }
  .btn:hover{background:var(--border)}
  .btn:active{transform:scale(.97)}

  .modal-bg{position:fixed;inset:0;background:rgba(6,8,14,.55);backdrop-filter:blur(2px);display:none;align-items:flex-end;justify-content:center;z-index:20;opacity:0;transition:opacity .14s ease}
  .modal-bg.show{display:flex;opacity:1}
  .modal{
    background:var(--bg);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:20px;border:1px solid var(--border);
    transform:translateY(16px);transition:transform .16s cubic-bezier(.2,.8,.2,1);box-shadow:0 -12px 30px rgba(0,0,0,.3);
  }
  .modal-bg.show .modal{transform:translateY(0)}
  @media (min-width:860px){
    .modal-bg{align-items:center}
    .modal{max-width:420px;border-radius:20px;transform:translateY(10px) scale(.98)}
    .modal-bg.show .modal{transform:none}
  }
  .modal h3{margin:0 0 14px;font-size:17px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
  .field input,.field select{
    width:100%;padding:12px;border-radius:11px;border:1px solid var(--border);background:var(--card2);color:var(--text);
    font-size:15px;font-family:inherit;transition:border-color .15s ease;
  }
  .field input:focus,.field select:focus{outline:none;border-color:var(--accent)}
  .cur-toggle{display:flex;gap:6px}
  .cur-toggle button{
    flex:1;padding:10px 4px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:var(--muted);
    font-weight:700;cursor:pointer;font-size:13.5px;transition:all .15s ease;font-family:inherit;
  }
  .cur-toggle button.active{background:var(--grad);color:#fff;border-color:transparent}
  .modal-actions{display:flex;gap:8px;margin-top:8px}
  .modal-actions .btn.primary{background:var(--grad);color:#fff;border-color:transparent}
  .modal-actions .btn.danger{background:linear-gradient(135deg,var(--danger),#ff8a6a);color:#fff;border-color:transparent}

  a{color:var(--accent)}
  .login-screen{max-width:420px;margin:14vh auto 0;text-align:center;padding:0 24px}
  .login-screen .logo{width:64px;height:64px;border-radius:20px;background:var(--grad);margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 12px 26px rgba(124,140,255,.4)}
  .login-screen h1{font-size:21px}
  .login-screen .sub{font-size:14px;line-height:1.6;margin-top:8px}

  /* Toast */
  #toastWrap{position:fixed;left:0;right:0;bottom:22px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:30;pointer-events:none}
  .toast{
    pointer-events:auto;background:var(--card);border:1px solid var(--border);color:var(--text);
    padding:11px 14px;border-radius:14px;font-size:13.5px;box-shadow:var(--shadow);
    display:flex;align-items:center;gap:12px;max-width:88vw;
    animation:toastIn .18s cubic-bezier(.2,.8,.2,1) both;
  }
  .toast.leaving{animation:toastOut .16s ease both}
  @keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
  @keyframes toastOut{to{opacity:0;transform:translateY(6px) scale(.96)}}
  .toast button{background:none;border:none;color:var(--accent);font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;padding:2px}

  /* Skeleton loading */
  .skel{background:linear-gradient(90deg,var(--card2) 25%,var(--border) 37%,var(--card2) 63%);background-size:400% 100%;animation:shimmer 1.3s ease infinite;border-radius:8px}
  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
  .skel-total{width:150px;height:30px;margin-bottom:10px}
  .skel-sub{width:100px;height:12px;margin-bottom:16px}
  .skel-bar{height:8px;width:100%;margin-bottom:10px}
  .skel-row{height:58px;border-radius:var(--radius-sm);margin-bottom:9px}
  .skel-day{width:120px;height:11px;margin:16px 0 8px}
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div class="brand">
      <div class="logo">💸</div>
      <div>
        <h1 id="greeting">Мои траты</h1>
        <div class="sub" id="usernameSub"></div>
      </div>
    </div>
    <button class="gear" id="settingsBtn" title="Настройки" onclick="openSettings()">⚙️</button>
  </div>
</header>

<main>
  <div id="root"><div class="loading"></div></div>
</main>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modalBody"></div>
</div>

<div id="toastWrap"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const CATEGORY_ICONS = {
  'Еда':'🍔','Транспорт':'🚗','Дом':'🏠','Здоровье':'💊','Развлечения':'🎬',
  'Одежда':'👕','Связь':'📱','Образование':'📚','Прочее':'📦'
};
const CURRENCIES = ['TJS','RUB','USD','EUR'];
const CUR_SYMBOL = { TJS:'SM', RUB:'₽', USD:'$', EUR:'€' };

const state = { period: 'month', me: null, summary: null, expenses: [], categories: [], fab: null };
const $ = (s, el) => (el||document).querySelector(s);
const root = () => document.getElementById('root');
const BASE = 'https://stkevjznrrbcfvkxrxut.supabase.co/functions/v1/app';

function getDefaultCurrency() {
  try { return localStorage.getItem('defaultCurrency') || 'TJS'; } catch (e) { return 'TJS'; }
}
function setDefaultCurrency(cur) {
  try { localStorage.setItem('defaultCurrency', cur); } catch (e) { /* ignore */ }
}

async function api(path, opts) {
  const res = await fetch(BASE + '/' + path, Object.assign({ credentials: 'include', headers: { 'Content-Type': 'application/json' } }, opts));
  if (res.status === 401) { showLogin(); throw new Error('unauthorized'); }
  if (!res.ok) throw new Error(await res.text());
  const ct = res.headers.get('content-type') || '';
  return ct.includes('application/json') ? res.json() : res.text();
}

function fmtMoney(n, cur) {
  const s = Number(n).toLocaleString('ru-RU', { maximumFractionDigits: 2 });
  return s + ' ' + (CUR_SYMBOL[cur] || '₽');
}
function fmtDay(d) {
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', weekday: 'short' });
}
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---------------------------------------------------------------------------
// Haptics + sound — small feedback on actions that change your balance.
// Both are best-effort: iOS Safari has no navigator.vibrate, and audio
// needs a user gesture to start, which every caller here already is.
// ---------------------------------------------------------------------------

function haptic(ms) {
  try { if (navigator.vibrate) navigator.vibrate(ms || 8); } catch (e) { /* not supported */ }
}

let audioCtx = null;
function getAudioCtx() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    return audioCtx;
  } catch (e) { return null; }
}
// A short two-note "coin" chime, synthesized on the fly — no audio file to load.
function playCoinSound() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  const now = ctx.currentTime;
  [880, 1318.5].forEach((freq, i) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    const t0 = now + i * 0.075;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(0.16, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.24);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + 0.26);
  });
}
// A tiny, quiet click — like the iOS keyboard sound — played per keystroke.
function playKeySound() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'square';
  osc.frequency.value = 1300 + Math.random() * 200;
  gain.gain.setValueAtTime(0.05, now);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.028);
  osc.connect(gain).connect(ctx.destination);
  osc.start(now);
  osc.stop(now + 0.03);
}
// A softer single blip for delete/undo.
function playBlipSound() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(520, now);
  osc.frequency.exponentialRampToValueAtTime(300, now + 0.14);
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.linearRampToValueAtTime(0.14, now + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
  osc.connect(gain).connect(ctx.destination);
  osc.start(now);
  osc.stop(now + 0.18);
}

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------

async function boot() {
  renderSkeleton();
  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  if (token) {
    try {
      await api('api/login', { method: 'POST', body: JSON.stringify({ token }) });
      history.replaceState({}, '', location.pathname);
    } catch (e) { /* invalid/expired token -> will fall through to login screen */ }
  }
  try {
    state.me = await api('api/me');
  } catch (e) {
    showLogin();
    return;
  }
  document.getElementById('greeting').textContent = 'Привет' + (state.me.first_name ? ', ' + state.me.first_name : '');
  document.getElementById('usernameSub').textContent = state.me.username ? '@' + state.me.username : '';
  state.categories = await api('api/categories');
  await loadPeriod('month');
}

function showLogin() {
  document.getElementById('settingsBtn').style.display = 'none';
  root().innerHTML = '<div class="login-screen"><div class="logo">🔒</div><h1>Вход через Telegram</h1>' +
    '<p class="sub">Откройте бота в Telegram и нажмите «Открыть панель» — ссылка авторизует вас автоматически, без пароля.</p></div>';
}

function renderSkeleton() {
  root().innerHTML =
    '<div class="tabs">' + tab('today','Сегодня') + tab('week','Неделя') + tab('month','Месяц') + '</div>' +
    '<div class="card">' +
      '<div class="skel skel-total"></div><div class="skel skel-sub"></div>' +
      '<div class="skel skel-bar"></div><div class="skel skel-bar" style="width:70%"></div><div class="skel skel-bar" style="width:45%"></div>' +
    '</div>' +
    '<div class="skel skel-day"></div>' +
    '<div class="skel skel-row"></div><div class="skel skel-row"></div><div class="skel skel-row"></div>';
}

// ---------------------------------------------------------------------------
// Data + render
// ---------------------------------------------------------------------------

async function loadPeriod(period) {
  state.period = period;
  renderSkeleton();
  const [summary, expenses] = await Promise.all([
    api('api/summary?period=' + period),
    api('api/expenses?period=' + period),
  ]);
  state.summary = summary;
  state.expenses = expenses;
  render();
}

function render() {
  const s = state.summary;
  const totalsHtml = Object.entries(s.totals_by_currency).length
    ? Object.entries(s.totals_by_currency).map(([cur, val]) =>
        '<div class="total-row"><span class="total" data-count="' + val + '" data-cur="' + cur + '">0</span></div>'
      ).join('')
    : '<div class="total-row"><span class="total">0 ₽</span></div>';

  const maxCat = Math.max(1, ...s.by_category.map(c => c.total));
  const catsHtml = s.by_category.map(c => {
    const pct = Math.round((c.total / maxCat) * 100);
    const over = c.limit && c.total > c.limit;
    const icon = CATEGORY_ICONS[c.category] || '📦';
    return '<div class="catrow"><div class="row">' +
      '<span class="cat-name"><span class="cat-icon">' + icon + '</span>' + c.category + '</span>' +
      '<span>' + fmtMoney(c.total, c.currency) + (c.limit ? ' / ' + fmtMoney(c.limit, c.currency) : '') + '</span></div>' +
      '<div class="bar-bg"><div class="bar-fill' + (over ? ' over' : '') + '" data-pct="' + pct + '" style="width:0"></div></div></div>';
  }).join('') || '<div class="empty"><span class="emoji">🌤️</span>Пока нет трат за этот период</div>';

  const byDay = {};
  for (const e of state.expenses) (byDay[e.spent_at] ||= []).push(e);
  const days = Object.keys(byDay).sort().reverse();
  const listHtml = days.length ? days.map(d =>
    '<div class="day-group"><div class="day-label">' + fmtDay(d) + '</div>' +
    byDay[d].map(e => expenseRow(e)).join('') + '</div>'
  ).join('') : '<div class="empty"><span class="emoji">🧾</span>Трат пока нет — напишите боту, например «кофе 350»</div>';

  root().innerHTML =
    '<div class="layout">' +
      '<div class="col-summary">' +
        '<div class="tabs">' + tab('today','Сегодня') + tab('week','Неделя') + tab('month','Месяц') + '</div>' +
        '<div class="card">' + totalsHtml + '<div class="sub">итого за период</div>' +
          '<div class="catbar-wrap">' + catsHtml + '</div></div>' +
        '<div class="toolbar">' +
          '<button class="btn" onclick="exportPdf()">📄 PDF</button>' +
          '<button class="btn" onclick="openBudgets()">🎯 Лимиты</button>' +
        '</div>' +
      '</div>' +
      '<div class="col-list">' + listHtml + '</div>' +
    '</div>' +
    '<button class="fab" onclick="openAdd()">+</button>';

  document.querySelectorAll('.tab').forEach(t => t.onclick = () => { haptic(6); loadPeriod(t.dataset.p); });

  // animate numbers + bars in
  requestAnimationFrame(() => {
    document.querySelectorAll('.total[data-count]').forEach(el => animateCount(el));
    document.querySelectorAll('.bar-fill[data-pct]').forEach(el => { el.style.width = el.dataset.pct + '%'; });
  });
}

function animateCount(el) {
  const target = parseFloat(el.dataset.count);
  const cur = el.dataset.cur;
  const start = performance.now();
  const dur = 380;
  function step(now) {
    const p = Math.min(1, (now - start) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = fmtMoney(target * eased, cur);
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function tab(p, label) {
  return '<div class="tab' + (state.period === p ? ' active' : '') + '" data-p="' + p + '">' + label + '</div>';
}

function expenseRow(e) {
  const icon = CATEGORY_ICONS[e.category] || '📦';
  return '<div class="expense" id="exp-' + e.id + '">' +
    '<div class="left"><div class="cat-emoji">' + icon + '</div>' +
    '<div class="meta"><div class="desc">' + escapeHtml(e.description || '—') + '</div><div class="cat">' + escapeHtml(e.category) + '</div></div></div>' +
    '<div class="row"><div class="amt">' + fmtMoney(e.amount, e.currency) + '</div>' +
    '<div class="actions">' +
      '<button class="iconbtn" onclick="openEdit(' + e.id + ')">✏️</button>' +
      '<button class="iconbtn" onclick="delExpense(' + e.id + ')">🗑</button>' +
    '</div></div></div>';
}

// ---------------------------------------------------------------------------
// Toasts
// ---------------------------------------------------------------------------

function showToast(message, opts) {
  opts = opts || {};
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = '<span>' + message + '</span>';
  if (opts.actionLabel) {
    const btn = document.createElement('button');
    btn.textContent = opts.actionLabel;
    btn.onclick = () => { opts.onAction && opts.onAction(); dismiss(); };
    el.appendChild(btn);
  }
  wrap.appendChild(el);
  const timeout = opts.duration || 2600;
  const t = setTimeout(dismiss, timeout);
  function dismiss() {
    clearTimeout(t);
    el.classList.add('leaving');
    setTimeout(() => el.remove(), 160);
  }
  return dismiss;
}

// ---------------------------------------------------------------------------
// Modals
// ---------------------------------------------------------------------------

function showModal(html) { $('#modalBody').innerHTML = html; $('#modalBg').classList.add('show'); }
function closeModal() { $('#modalBg').classList.remove('show'); }
document.getElementById('modalBg').addEventListener('click', (e) => { if (e.target.id === 'modalBg') closeModal(); });
// Keyboard click sound for every character typed in a modal text field.
$('#modalBody').addEventListener('input', (e) => {
  if (e.target.tagName === 'INPUT') { playKeySound(); haptic(4); }
});

function categoryOptions(selected) {
  return state.categories.map(c => {
    const icon = CATEGORY_ICONS[c] || '📦';
    return '<option value="' + c + '"' + (c === selected ? ' selected' : '') + '>' + icon + ' ' + c + '</option>';
  }).join('');
}

function currencyToggle(selected) {
  return '<div class="cur-toggle" id="curToggle">' + CURRENCIES.map(c =>
    '<button type="button" data-cur="' + c + '" class="' + (c === selected ? 'active' : '') + '">' + CUR_SYMBOL[c] + ' ' + c + '</button>'
  ).join('') + '</div>';
}
function wireCurToggle() {
  document.querySelectorAll('#curToggle button').forEach(b => b.onclick = () => {
    document.querySelectorAll('#curToggle button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
  });
}
function selectedCurrency() {
  const active = document.querySelector('#curToggle button.active');
  return active ? active.dataset.cur : 'RUB';
}

function openAdd() {
  haptic(8);
  const def = getDefaultCurrency();
  showModal(
    '<h3>Новая трата</h3>' +
    '<div class="field"><label>Сумма</label><input id="f_amount" type="number" inputmode="decimal" placeholder="350"></div>' +
    '<div class="field"><label>Валюта</label>' + currencyToggle(def) + '</div>' +
    '<div class="field"><label>Описание</label><input id="f_desc" placeholder="кофе"></div>' +
    '<div class="field"><label>Категория</label><select id="f_cat">' + categoryOptions(null) + '</select></div>' +
    '<div class="modal-actions"><button class="btn" onclick="closeModal()">Отмена</button>' +
    '<button class="btn primary" onclick="submitAdd()">Добавить</button></div>'
  );
  wireCurToggle();
  setTimeout(() => $('#f_amount').focus(), 160);
}
let modalBusy = false;
async function submitAdd() {
  if (modalBusy) return; // ignore extra taps while the first add is still in flight
  const amount = parseFloat($('#f_amount').value);
  if (!amount || amount <= 0) { $('#f_amount').focus(); return; }
  modalBusy = true;
  const btn = document.querySelector('.modal-actions .btn.primary');
  if (btn) btn.disabled = true;
  try {
    const currency = selectedCurrency();
    setDefaultCurrency(currency);
    const desc = $('#f_desc').value;
    await api('api/expenses', { method: 'POST', body: JSON.stringify({
      amount, currency, description: desc, category: $('#f_cat').value,
    })});
    closeModal();
    await loadPeriod(state.period);
    playCoinSound();
    haptic(10);
    showToast('Добавлено: ' + fmtMoney(amount, currency) + (desc ? ' · ' + escapeHtml(desc) : ''));
  } finally {
    modalBusy = false;
  }
}

function openEdit(id) {
  const e = state.expenses.find(x => x.id === id);
  if (!e) return;
  haptic(8);
  showModal(
    '<h3>Изменить трату</h3>' +
    '<div class="field"><label>Сумма</label><input id="f_amount" type="number" inputmode="decimal" value="' + e.amount + '"></div>' +
    '<div class="field"><label>Валюта</label>' + currencyToggle(e.currency) + '</div>' +
    '<div class="field"><label>Описание</label><input id="f_desc" value="' + escapeHtml(e.description) + '"></div>' +
    '<div class="field"><label>Категория</label><select id="f_cat">' + categoryOptions(e.category) + '</select></div>' +
    '<div class="modal-actions"><button class="btn danger" onclick="delExpense(' + id + '); closeModal();">Удалить</button>' +
    '<button class="btn primary" onclick="submitEdit(' + id + ')">Сохранить</button></div>'
  );
  wireCurToggle();
}
async function submitEdit(id) {
  if (modalBusy) return;
  const amount = parseFloat($('#f_amount').value);
  if (!amount || amount <= 0) { $('#f_amount').focus(); return; }
  modalBusy = true;
  const btn = document.querySelector('.modal-actions .btn.primary');
  if (btn) btn.disabled = true;
  try {
    const currency = selectedCurrency();
    await api('api/expenses/' + id, { method: 'PATCH', body: JSON.stringify({
      amount, currency, description: $('#f_desc').value, category: $('#f_cat').value,
    })});
    closeModal();
    await loadPeriod(state.period);
    playCoinSound();
    haptic(10);
    showToast('Сохранено');
  } finally {
    modalBusy = false;
  }
}

// Optimistic delete: hide immediately, show an "Undo" toast, only call the
// API once the toast expires without being cancelled — this is what makes
// it obvious *what* just got deleted instead of the list silently changing.
const pendingDeletes = {};
function delExpense(id) {
  if (pendingDeletes[id]) return; // already being deleted, ignore extra taps
  const row = document.getElementById('exp-' + id);
  const e = state.expenses.find(x => x.id === id);
  if (row) row.classList.add('leaving');
  haptic(12);
  playBlipSound();
  const label = e ? (e.description || e.category) : 'трата';
  const dismissToast = showToast('Удалено: ' + escapeHtml(label), {
    actionLabel: 'Отменить',
    duration: 3200,
    onAction: () => {
      clearTimeout(pendingDeletes[id]);
      delete pendingDeletes[id];
      if (row) row.classList.remove('leaving');
      haptic(6);
    },
  });
  pendingDeletes[id] = setTimeout(async () => {
    delete pendingDeletes[id];
    try { await api('api/expenses/' + id, { method: 'DELETE' }); } catch (err) { /* already gone */ }
    await loadPeriod(state.period);
  }, 3200);
}

async function openBudgets() {
  const budgets = await api('api/budgets');
  const rows = state.categories.map(c => {
    const b = budgets.find(x => x.category === c);
    const icon = CATEGORY_ICONS[c] || '📦';
    return '<div class="field"><label>' + icon + ' ' + c + '</label><input data-cat="' + c + '" type="number" inputmode="decimal" placeholder="без лимита" value="' + (b ? b.monthly_limit : '') + '"></div>';
  }).join('');
  showModal('<h3>Лимиты на месяц</h3>' + rows +
    '<div class="modal-actions"><button class="btn" onclick="closeModal()">Закрыть</button>' +
    '<button class="btn primary" onclick="saveBudgets()">Сохранить</button></div>');
}
async function saveBudgets() {
  if (modalBusy) return;
  modalBusy = true;
  const btn = document.querySelector('.modal-actions .btn.primary');
  if (btn) btn.disabled = true;
  try {
    const inputs = document.querySelectorAll('[data-cat]');
    const items = [];
    inputs.forEach(i => items.push({ category: i.dataset.cat, monthly_limit: i.value ? parseFloat(i.value) : null }));
    await api('api/budgets', { method: 'POST', body: JSON.stringify({ items }) });
    closeModal();
    await loadPeriod(state.period);
    haptic(10);
    showToast('Лимиты сохранены');
  } finally {
    modalBusy = false;
  }
}

function openSettings() {
  haptic(8);
  const def = getDefaultCurrency();
  showModal(
    '<h3>Настройки</h3>' +
    '<div class="field"><label>Валюта по умолчанию</label>' + currencyToggle(def) + '</div>' +
    '<div class="modal-actions"><button class="btn" onclick="closeModal()">Закрыть</button>' +

// ---------------------------------------------------------------------------
// PDF export — renders a paper-styled report of the current period to an
// offscreen node, rasterizes it (so Cyrillic text always renders correctly,
// no font-embedding needed) and drops it into a paginated A4 PDF.
// ---------------------------------------------------------------------------

function periodLabel(p) {
  return p === 'today' ? 'Сегодня' : p === 'week' ? 'За неделю' : 'За месяц';
}

function buildReportHtml() {
  const s = state.summary;
  const totals = Object.entries(s.totals_by_currency).map(([cur, val]) => fmtMoney(val, cur)).join(' + ') || '0';
  const catRows = s.by_category.map(c => {
    const icon = CATEGORY_ICONS[c.category] || '📦';
    return '<tr><td style="padding:6px 10px;border-bottom:1px solid #eee;">' + icon + ' ' + escapeHtml(c.category) + '</td>' +
      '<td style="padding:6px 10px;border-bottom:1px solid #eee;text-align:right;font-weight:700;">' + fmtMoney(c.total, c.currency) +
      (c.limit ? ' <span style="color:#999;font-weight:400">/ ' + fmtMoney(c.limit, c.currency) + '</span>' : '') + '</td></tr>';
  }).join('') || '<tr><td colspan="2" style="padding:10px;color:#999;">Пока нет трат</td></tr>';

  const byDay = {};
  for (const e of state.expenses) (byDay[e.spent_at] ||= []).push(e);
  const days = Object.keys(byDay).sort().reverse();
  const rowsHtml = days.length ? days.map(d => {
    const dayRows = byDay[d].map(e => {
      const icon = CATEGORY_ICONS[e.category] || '📦';
      return '<tr>' +
        '<td style="padding:7px 10px;border-bottom:1px solid #f2f2f2;">' + icon + ' ' + escapeHtml(e.description || '—') +
        '<div style="color:#999;font-size:11px">' + escapeHtml(e.category) + '</div></td>' +
        '<td style="padding:7px 10px;border-bottom:1px solid #f2f2f2;text-align:right;font-weight:600;white-space:nowrap;">' + fmtMoney(e.amount, e.currency) + '</td>' +
      '</tr>';
    }).join('');
    return '<tr><td colspan="2" style="padding:14px 10px 4px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#999;font-weight:700;">' + fmtDay(d) + '</td></tr>' + dayRows;
  }).join('') : '<tr><td colspan="2" style="padding:14px 10px;color:#999;">Трат нет</td></tr>';

  const generated = new Date().toLocaleString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  const who = (state.me && state.me.first_name ? escapeHtml(state.me.first_name) : '') + (state.me && state.me.username ? ' · @' + escapeHtml(state.me.username) : '');

  return '' +
    '<div style="display:flex;align-items:center;gap:12px;margin-bottom:6px;">' +
      '<div style="width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#7c8cff,#9d6bff);display:flex;align-items:center;justify-content:center;font-size:20px;">💸</div>' +
      '<div><div style="font-size:20px;font-weight:800;color:#1a1d29;">Мои траты</div>' +
      '<div style="font-size:12px;color:#888;">' + who + '</div></div>' +
    '</div>' +
    '<div style="font-size:12px;color:#999;margin-bottom:20px;">' + periodLabel(state.period) + ' · сформировано ' + generated + '</div>' +
    '<div style="font-size:30px;font-weight:800;margin-bottom:4px;color:#1a1d29;">' + totals + '</div>' +
    '<div style="font-size:12px;color:#999;margin-bottom:16px;">итого за период</div>' +
    '<table style="width:100%;border-collapse:collapse;margin-bottom:8px;color:#1a1d29;">' + catRows + '</table>' +
    '<div style="height:1px;background:#eee;margin:18px 0;"></div>' +
    '<table style="width:100%;border-collapse:collapse;color:#1a1d29;">' + rowsHtml + '</table>' +
    '<div style="margin-top:24px;font-size:10.5px;color:#bbb;text-align:center;">Сгенерировано ботом @Rashod_tj_bot</div>';
}

async function exportPdf() {
  if (!window.jspdf || !window.html2canvas) { showToast('PDF ещё загружается — попробуйте ещё раз через секунду'); return; }
  haptic(8);
  const container = document.createElement('div');
  container.style.cssText = 'position:fixed;left:-10000px;top:0;width:720px;background:#ffffff;font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;padding:32px;';
  container.innerHTML = buildReportHtml();
  document.body.appendChild(container);
  try {
    const canvas = await html2canvas(container, { scale: 1.5, backgroundColor: '#ffffff', useCORS: true });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: 'pt', format: 'a4', compress: true });
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const imgWidth = pageWidth;
    const imgHeight = canvas.height * (imgWidth / canvas.width);
    // JPEG at high quality keeps this a readable few-hundred-KB file instead
    // of a multi-MB PNG — it's a text/table report, not a photo, so the
    // slight compression is not visible.
    const imgData = canvas.toDataURL('image/jpeg', 0.92);
    let heightLeft = imgHeight;
    let position = 0;
    pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
    while (heightLeft > 0) {
      position -= pageHeight;
      pdf.addPage();
      pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }
    pdf.save('expenses-' + state.period + '-' + localDateStr() + '.pdf');
    haptic(10);
  } catch (e) {
    showToast('Не получилось собрать PDF, попробуйте ещё раз');
  } finally {
    container.remove();
  }
}
function localDateStr() { return new Date().toISOString().slice(0, 10); }
